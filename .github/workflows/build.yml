name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KillAura
          path: build/libs/*.jar
